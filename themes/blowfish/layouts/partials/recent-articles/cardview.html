{{ $pages := where .Site.RegularPages "Type" "in" .Site.Params.mainSections }}
{{ $featured := where $pages "Params.featured" true }}

<div style="position:relative; left:50%; width:100vw; transform:translateX(-50%);">
  <section
    style="display:flex; flex-wrap:wrap; justify-content:center; gap:16px; max-width:1600px; margin:0 auto; padding:0 30px;">
    {{ range $featured }}
      {{ partial "article-link/card.html" . }}
    {{ end }}
  </section>
</div>
